# Compile SpotMyCar automatiquement sur les serveurs de GitHub.
#
# - À chaque envoi de code : vérifie que l'app compile et fournit un APK de test.
# - À chaque étiquette de version (ex. v1.0.0) : fabrique l'APK signé et le publie
#   en téléchargement public (page « Releases »), plus le fichier .aab pour Google Play.
name: Build Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK de test
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Mettre l'APK de test à disposition
        uses: actions/upload-artifact@v4
        with:
          name: SpotMyCar-test
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ── Version publique : seulement sur une étiquette v… ──────────────────
      - name: Fabriquer la version signée
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SPOTMYCAR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SPOTMYCAR_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SPOTMYCAR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secrets de signature absents (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/spotmycar-release.jks"
          export SPOTMYCAR_KEYSTORE="$RUNNER_TEMP/spotmycar-release.jks"
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk SpotMyCar.apk
          cp app/build/outputs/bundle/release/app-release.aab SpotMyCar.aab
          rm -f "$RUNNER_TEMP/spotmycar-release.jks"

      - name: Publier le téléchargement
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" SpotMyCar.apk \
            --title "SpotMyCar $GITHUB_REF_NAME" \
            --notes "Version $GITHUB_REF_NAME de SpotMyCar pour Android. Téléchargez SpotMyCar.apk puis ouvrez-le pour l'installer." \
            || gh release upload "$GITHUB_REF_NAME" SpotMyCar.apk --clobber

      - name: Garder le fichier pour Google Play (.aab)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: SpotMyCar-google-play
          path: SpotMyCar.aab
          if-no-files-found: error
